services:
  - type: web
    name: bergstieg
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AITUNNEL_API_KEY
        sync: false
      - key: AITUNNEL_MODEL
        value: gpt-5.4
      - key: AITUNNEL_QUESTION_MODEL
        value: gpt-5.4
